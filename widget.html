<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenza — Category Widget (Color Coded)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #060913;
            color: #FFFFFF;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(245, 158, 11, 0.15);
            color: #F59E0B;
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF 0%, #C4B5FD 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #94A3B8;
            font-size: 14px;
        }

        /* ─── Android Home Screen Widget Mockup (1:1 Ratio) ─── */
        .widget-stage {
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 36px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        .widget-category-card {
            width: 250px;
            height: 250px;
            background: linear-gradient(180deg, #241568 0%, #150B3D 100%);
            border-radius: 28px;
            padding: 20px 16px 18px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 16px 36px -8px rgba(10, 4, 30, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.08);
            user-select: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .widget-category-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 24px 48px -10px rgba(10, 4, 30, 1), 0 0 0 1px rgba(196, 181, 253, 0.25);
        }

        .widget-title {
            font-size: 20px;
            font-weight: 800;
            color: #C4B5FD;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* 4 Concentric Rings */
        .rings-container {
            width: 120px;
            height: 120px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rings-container svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        /* Stat Row (4 Columns) */
        .stat-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            width: 100%;
            gap: 2px;
            text-align: center;
        }

        .stat-col {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .stat-value {
            font-size: 17px;
            font-weight: 800;
            color: #FFFFFF;
            margin-top: 1px;
        }

        /* Category Color Specifics */
        .cat-food { color: #F59E0B; }
        .cat-shop { color: #EC4899; }
        .cat-trans { color: #38BDF8; }
        .cat-bills { color: #A78BFA; }

        /* ─── Control Bar ─── */
        .control-bar {
            margin-top: 24px;
            display: flex;
            gap: 12px;
        }

        .toggle-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #E2E8F0;
            padding: 8px 18px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toggle-btn:hover, .toggle-btn.active {
            background: #8B7CF6;
            color: #FFFFFF;
            border-color: #8B7CF6;
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="badge">✦ Category-Coded Colors</div>
        <h1>Category Concentric Widget</h1>
        <p class="subtitle">Each ring and stat label is rendered in its category's color.</p>
    </div>

    <div class="widget-stage">
        <!-- 1:1 Native Android Widget Card -->
        <div class="widget-category-card" id="widgetCard">
            <!-- Title -->
            <div class="widget-title">CATEGORY</div>

            <!-- Rings image (Rendered via SVG exactly matching RingRenderer.kt) -->
            <div class="rings-container">
                <svg viewBox="0 0 120 120">
                    <!-- Ring 1 (Food - Amber #F59E0B) -->
                    <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(245, 158, 11, 0.22)" stroke-width="6.6" />
                    <circle id="ring1" cx="60" cy="60" r="50" fill="none" stroke="#F59E0B" stroke-width="6.6" stroke-dasharray="314" stroke-dashoffset="150" stroke-linecap="round" />

                    <!-- Ring 2 (Shopping - Rose Pink #EC4899) -->
                    <circle cx="60" cy="60" r="40" fill="none" stroke="rgba(236, 72, 153, 0.22)" stroke-width="6.6" />
                    <circle id="ring2" cx="60" cy="60" r="40" fill="none" stroke="#EC4899" stroke-width="6.6" stroke-dasharray="251" stroke-dashoffset="170" stroke-linecap="round" />

                    <!-- Ring 3 (Transport - Cyan #38BDF8) -->
                    <circle cx="60" cy="60" r="30" fill="none" stroke="rgba(56, 189, 248, 0.22)" stroke-width="6.6" />
                    <circle id="ring3" cx="60" cy="60" r="30" fill="none" stroke="#38BDF8" stroke-width="6.6" stroke-dasharray="188" stroke-dashoffset="160" stroke-linecap="round" />

                    <!-- Ring 4 (Bills - Violet #A78BFA) -->
                    <circle cx="60" cy="60" r="20" fill="none" stroke="rgba(167, 139, 250, 0.22)" stroke-width="6.6" />
                    <circle id="ring4" cx="60" cy="60" r="20" fill="none" stroke="#A78BFA" stroke-width="6.6" stroke-dasharray="125" stroke-dashoffset="28" stroke-linecap="round" />
                </svg>
            </div>

            <!-- Stat Row: 4 Columns -->
            <div class="stat-row">
                <div class="stat-col">
                    <span class="stat-label cat-food" id="lbl1">FOOD</span>
                    <span class="stat-value" id="val1">52%</span>
                </div>
                <div class="stat-col">
                    <span class="stat-label cat-shop" id="lbl2">SHOP</span>
                    <span class="stat-value" id="val2">32%</span>
                </div>
                <div class="stat-col">
                    <span class="stat-label cat-trans" id="lbl3">TRANS</span>
                    <span class="stat-value" id="val3">15%</span>
                </div>
                <div class="stat-col">
                    <span class="stat-label cat-bills" id="lbl4">BILLS</span>
                    <span class="stat-value" id="val4">77%</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Quick Preview Data Switcher -->
    <div class="control-bar">
        <button class="toggle-btn active" onclick="setMode('expense')">Category Coded Colors</button>
        <button class="toggle-btn" onclick="setMode('sleep')">Sleep Reference Palette (Monochrome Purple)</button>
    </div>

    <script>
        function setMode(mode) {
            const btns = document.querySelectorAll('.toggle-btn');
            btns.forEach(b => b.classList.remove('active'));

            if (mode === 'expense') {
                btns[0].classList.add('active');
                document.getElementById('lbl1').textContent = 'FOOD';
                document.getElementById('lbl1').className = 'stat-label cat-food';
                document.getElementById('val1').textContent = '52%';

                document.getElementById('lbl2').textContent = 'SHOP';
                document.getElementById('lbl2').className = 'stat-label cat-shop';
                document.getElementById('val2').textContent = '32%';

                document.getElementById('lbl3').textContent = 'TRANS';
                document.getElementById('lbl3').className = 'stat-label cat-trans';
                document.getElementById('val3').textContent = '15%';

                document.getElementById('lbl4').textContent = 'BILLS';
                document.getElementById('lbl4').className = 'stat-label cat-bills';
                document.getElementById('val4').textContent = '77%';

                document.getElementById('ring1').style.stroke = '#F59E0B';
                document.getElementById('ring2').style.stroke = '#EC4899';
                document.getElementById('ring3').style.stroke = '#38BDF8';
                document.getElementById('ring4').style.stroke = '#A78BFA';
            } else {
                btns[1].classList.add('active');
                document.getElementById('lbl1').textContent = 'DEEP';
                document.getElementById('lbl1').className = 'stat-label';
                document.getElementById('lbl1').style.color = '#A78BFA';
                document.getElementById('val1').textContent = '52%';

                document.getElementById('lbl2').textContent = 'LIGHT';
                document.getElementById('lbl2').className = 'stat-label';
                document.getElementById('lbl2').style.color = '#A78BFA';
                document.getElementById('val2').textContent = '32%';

                document.getElementById('lbl3').textContent = 'AWAKE';
                document.getElementById('lbl3').className = 'stat-label';
                document.getElementById('lbl3').style.color = '#A78BFA';
                document.getElementById('val3').textContent = '9h 8m';

                document.getElementById('lbl4').textContent = 'QUALITY';
                document.getElementById('lbl4').className = 'stat-label';
                document.getElementById('lbl4').style.color = '#A78BFA';
                document.getElementById('val4').textContent = '77%';

                document.getElementById('ring1').style.stroke = '#8B7CF6';
                document.getElementById('ring2').style.stroke = '#7C6AED';
                document.getElementById('ring3').style.stroke = '#6D5AE0';
                document.getElementById('ring4').style.stroke = '#5C4AD1';
            }
        }
    </script>

</body>

</html>
